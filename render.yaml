# Render blueprint: one Docker web service. Set the secret env vars in the Render dashboard, never in this file.
services:
  - type: web
    name: fixhunt
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_PROJECT_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIXHUNT_ACCESS
        sync: false          # e.g. "judges-xxxx:5,public-yyyy:0.5"
      - key: FIXHUNT_DAILY_CAP
        value: "10"
      - key: FIXHUNT_SANDBOX
        value: contree-always
      - key: FIXHUNT_HOST
        value: 0.0.0.0
